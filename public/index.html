<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- Web app installabile (PWA, 15/10/2026): il manifest, le icone per la
         schermata Home, la barra di stato a tutto schermo su iPhone (i margini
         li tengono le schermate con le safe area) e il service worker. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: dark) and (max-width: 899px)" content="#050506" />
    <meta name="theme-color" media="(prefers-color-scheme: light), (min-width: 900px)" content="#E4E5EA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Athlon Club 4.0" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // La richiesta di installazione (Chrome, Edge, Android) arriva presto: si
      // tiene da parte per il pulsante «Installa» della Home del laboratorio.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault()
        window.__installa = e
        window.dispatchEvent(new Event('athlon-installabile'))
      })
      // Il service worker solo sul sito vero: in sviluppo terrebbe i file vecchi.
      if ('serviceWorker' in navigator && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function (e) {
            console.error('Service worker non registrato', e)
          })
        })
      }
    </script>
    <script>
      // L'avvio animato (src/features/lab/avvio/mostra.ts) parte da un fondo scuro: se sta per
      // partire, anche la pagina prima che il codice giri lo e' gia', e non c'e' un lampo
      // di grigio chiaro. Le stesse regole di mostra.ts (una volta per scheda, non nelle
      // pagine pubbliche, non nei ritorni da altri siti, non in vista cliente): se qui si sbaglia,
      // l'effetto e' solo un fondo scuro per un istante, mai un avvio che non parte.
      try {
        var avvioPubblica = /^\/(r|richiesta)(\/|$)/.test(location.pathname)
        var avvioRitorno = /[?&](code|state|error|come)=/.test(location.search)
        if (!avvioPubblica && !avvioRitorno && !sessionStorage.getItem('athlon_avvio_mostrato') && !sessionStorage.getItem('athlon_vista_come')) {
          document.documentElement.setAttribute('data-avvio', '1')
        }
      } catch (e) {}
    </script>
    <meta name="robots" content="noindex" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* A tutto schermo come app installata (15/10/2026). Su iPhone, con la
         barra di stato trasparente, «100%» resta piu' corto dello schermo
         della misura della barra di stato, e sotto la barra delle schede
         rimaneva una striscia di pagina vuota: in modalita' app l'altezza e'
         quella dello schermo. E il fondo e' quello dell'app, non il bianco. */
      @media (display-mode: standalone) {
        html,
        body,
        #root {
          height: 100vh;
          min-height: 100vh;
        }
      }
      html,
      body {
        background-color: #e4e5ea;
      }
      /* Sul computer (da 900 px) il tema e' sempre chiaro, quello del sistema conta solo sul telefono: lo decide src/lib/schemaColori.ts. */
      @media (prefers-color-scheme: dark) and (max-width: 899px) {
        html,
        body {
          background-color: #050506;
        }
      }
      html[data-avvio],
      html[data-avvio] body {
        background-color: #0e0f11 !important;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
